# ── 26 键全键盘手势配置 ──
# 每个按键可定义以下手势：
#   tap:         点按
#   double_tap:  双击
#   swipe_up:    上滑
#   swipe_down:  下滑
#   swipe_left:  左滑
#   swipe_right: 右滑
#   long_press:  长按（数组，弹出气泡后左右滑动选择）
#
# 左右滑与整片键盘滑动移动光标的关系：
#   在键盘区域横向滑动默认用于移动光标；若某键配置了 swipe_left / swipe_right，
#   该键上的横向滑动即由按键接管（执行配置动作），不再移动光标；未配置左右滑的键
#   横向滑动仍用于移动光标。
#
# 每个手势的值格式：
#   - 字符串 "a" → 按槽位默认动作（tap 为 send_rime：走按键路由进 rime，与手敲
#     该键一致；swipe/长按为 commit：输出 value 直接上屏），显示也是它
#   - { label, action, value }
#     label:  按键上显示的文字
#     action: commit（上屏）, command（内置命令，value 为命令名）, select_all, copy, cut,
#             paste, line_start, line_end, undo, redo, none, repeat
#     undo/redo：IME 上屏栈，撤/重做上一笔本键盘送出去的字；不发 Ctrl+Z。
#     command 可用命令：
#       clear_composition - 清空当前输入编码和候选词
#     value:  上屏时的输出文本（不指定则用 label）
#   - 键级可选 width：列宽比例（数字）。字母键默认等宽（1），功能键有内置默认；
#     设置后仅改变该键宽度占比，不显示为文字。
#
# long_press 示例（弹出多个选项供滑动选择）：
#   long_press: { display: "bubble", values: [ { label: "大写", action: "commit", value: "A" }, { label: "Ä", action: "commit", value: "ä" } ] }
#   # 也支持字符串简写：
#   long_press: { display: "bubble", values: ["q", "Q"] }
keyboard:
  # ── 键盘颜色配置（可选，不设置则使用内置默认值）──
  # 背景色已由 color_schemes.*.keyboard_background 接管
  # key_bg_color             - 按键底色（亮色）
  # key_bg_color_dark        - 按键底色（暗色）
  # special_key_bg_color     - 特殊按键底色（亮色）
  # special_key_bg_color_dark- 特殊按键底色（暗色）
  # key_text_color           - 按键文字颜色（亮色）
  # key_text_color_dark      - 按键文字颜色（暗色）
  # candidate_text_color     - 候选文字颜色（亮色）
  # candidate_text_color_dark- 候选文字颜色（暗色）
  colors:
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x60FFFFFF
    # special_key_bg_color: 0x9fef86 #不设置时默认取主题色
    # special_key_bg_color_dark: 0x4A4A4A #不设置时默认取主题色
    key_text_color: 0x202124
    key_text_color_dark: 0xE8EAED
    candidate_text_color: 0x202124
    candidate_text_color_dark: 0xE8EAED
  
  # ── 按键配置（可选，不设置则使用默认值）──
  # corner_radius:      按键圆角半径（dp，默认 8），独立于 shadow.shape_radius
  # spacing_x:          按键横向间距（dp，默认 2），未设置时各键盘使用自身默认值
  # spacing_y:          按键竖向间距（dp，默认 4.25；横屏默认 2），未设置时各键盘使用自身默认值
  # 各键盘可单独覆盖间距（可选），键盘名：qwerty / t9 / number / stroke / symbol
  # 例如：t9: { spacing_x: 1, spacing_y: 2 }
  key:
    corner_radius: 8
    spacing_x: 2
    spacing_y: 4.25
    t9: { spacing_x: 2, spacing_y: 2 }
    number: { spacing_x: 2, spacing_y: 2 }
    stroke: { spacing_x: 2, spacing_y: 2 }
    symbol: { spacing_x: 2, spacing_y: 4.25 }

  # ── 按键阴影（可选，不设置则使用默认值）──
  # enabled:            是否启用阴影
  # elevation:          阴影高度（dp，默认 0.5）
  shadow:
    enabled: true
    elevation: 0.5

  # ── 字体配置（可选，配置为空时使用系统默认字体）──
  # 字体路径查找规则：
  #   - 绝对路径（以 / 开头）：从根目录找起，如 /fonts/myfont.ttf
  #   - 相对路径（包含 /）：相对于 rime/ 目录，如 fonts/myfont.ttf
  #   - 仅文件名：相对于 rime/ 目录查找，如 myfont.ttf
  fonts:
    key_font: ""
    key_label_font: ""
    candidate_font: ""
    comment_font: ""

  qwerty:
    # ── 按键布局模式（仅 26 键键盘支持；九键/笔画等其余键盘固定 standard，配置不生效）──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        # 第四行（控制行）：位置/是否出现由本 rows 决定，行为在下方 keys.<id> 配置
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 第一行 ──
      # long_press 顺序：小写 → 大写 → 带变音符号的相似字母
      # swipe_down 显示对应的五笔字根（action:none 仅显示不上屏）
      # display: bubble → 气泡显示；key → 显示在按键上（最多显示 2 个字）
      q: { tap: "q", swipe_up: "1", swipe_down: { label: "金 钅𠂊勺㐅 犭𱼀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", swipe_down: { label: "人亻八癶", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", swipe_down: { label: "月⺼彡乃用爫彡𧘇豕", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["e", "E", "è", "é", "ê", "ë"] } }
      r: { tap: "r", swipe_up: "4", swipe_down: { label: "白手龵扌斤𰀪𠂆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", swipe_down: { label: "禾竹丿𠂉彳夂攵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", swipe_down: { label: "言讠文方广亠丶乀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["y", "Y", "ÿ"] } }
      u: { tap: "u", swipe_up: "7", swipe_down: { label: "立六辛冫丬门疒丷䒑", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["u", "U", "ù", "ú", "û", "ü"] } }
      i: { tap: "i", swipe_up: "8", swipe_down: { label: "水氵小氺头𭕄⺌", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["i", "I", "ì", "í", "î", "ï"] } }
      o: { tap: "o", swipe_up: "9", swipe_down: { label: "火灬米", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { tap: "p", swipe_up: "0", swipe_down: { label: "之辶冖宀廴礻", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 数字行（设置「数字行」开关打开时显示在 QWERTY 上方）──
      "1": { tap: "1", swipe_up: "!", long_press: { display: "bubble", values: ["½", "⅓", "¼", "⅕", "⅙", "⅐", "⅛", "⅑", "⅒"] } }
      "2": { tap: "2", swipe_up: "@", long_press: { display: "bubble", values: ["⅔", "⅖"] } }
      "3": { tap: "3", swipe_up: "#", long_press: { display: "bubble", values: ["¾", "⅗", "⅜"] } }
      "4": { tap: "4", swipe_up: "$", long_press: { display: "bubble", values: ["⅘"] } }
      "5": { tap: "5", swipe_up: "%", long_press: { display: "bubble", values: ["⅚", "⅝"] } }
      "6": { tap: "6", swipe_up: "^", long_press: { display: "bubble", values: ["⅚"] } }
      "7": { tap: "7", swipe_up: "&", long_press: { display: "bubble", values: ["⅞"] } }
      "8": { tap: "8", swipe_up: "*", long_press: { display: "bubble", values: ["⅛", "⅜", "⅝", "⅞"] } }
      "9": { tap: "9", swipe_up: "(" }
      "0": { tap: "0", swipe_up: ")" }

      # ── 第二行 ──
      a: { tap: "a", swipe_up: { label: "～", value: "~" }, swipe_down: { label: "工匚戈艹廿龷七弋戈", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { tap: "s", swipe_up: { label: "／", value: "/" }, swipe_down: { label: "木丁西", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["s", "S", "ß"] } }
      d: { tap: "d", swipe_up: { label: "：", value: ":" }, swipe_down: { label: "大犬三古龵镸石厂丆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: { label: "；", value: ";" }, swipe_down: { label: "土士二干十寸雨", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: { label: "“", value: "“" }, swipe_down: { label: "王龶五一戋", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: { label: "”", value: "”" }, swipe_down: { label: "目丨卜⺊上止龰", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: { label: "－", value: "-" }, swipe_down: { label: "日曰早廾刂虫丿Ⅱ", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: { label: "（", value: "(" }, swipe_down: { label: "口Ⅲ川", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: { label: "）", value: ")" }, swipe_down: { label: "田甲囗四罒车皿力", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["l", "L"] } }
      # 分号键：仅 46 键布局使用（L 右侧补位）。
      # 点按空闲直上屏 ；；有编码路由器改发 ; 进声笔组词。上滑/长按 ：。
      ";": { tap: "；", swipe_up: "：", long_press: { display: "key", values: [ { label: "：", value: "：" } ] } }
      # ── 第三行 ──
      z: { tap: "z", swipe_up: { label: "＊", value: "*" }, swipe_down: { label: "", action: "none", display: "key", bubble: false }, long_press: { display: "bubble", values: [ "z","Z"] } }
      x: { tap: "x", swipe_up: { label: "＠", value: "@" }, swipe_down: { label: "弓匕纟幺弓𠤎", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: { label: "、", value: "、" }, swipe_down: { label: "又巴马厶龴ス", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: "v", swipe_up: { label: "？", value: "?" }, swipe_down: { label: "女刀九臼巛彐", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: { label: "！", value: "!" }, swipe_down: { label: "子耳了也阝卩㔾凵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: { label: "％", value: "%" }, swipe_down: { label: "已己巳心忄羽乙𠃜", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { tap: "m", swipe_up: { label: "＃", value: "#" }, swipe_down: { label: "山由贝冂冎几", action: "none", display: "bubble" }, long_press: { display: "bubble", values: ["m", "M"] } }
      # shift：单击切单击态、双击锁定大写；命令值走键盘按键路由（shift_single / shift_caps）
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      # delete：单击删除、长按重复删、上滑清空、下滑撤回、左右滑清空输入
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      # ── 第四行功能键（位置/是否出现由上方 layout.rows 第四行决定；行为在此定义）──
      # ?123：单击切面板，长按弹出「数字 / 常用符号」（命令值走键盘按键路由）
      mode_change: { width: 1.2, tap: { action: command, value: mode_change }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      # 空格键：单击上屏空格；长按进入语音输入（含麦克风权限校验）
      # 长按若想改为「重复空格」：long_press: { values: [ { action: repeat_space, value: 5 } ] }
      space: { width: 3, tap: { action: space }, long_press: { values: [ { action: voice } ] } }
      # 回车键
      enter: { width: 1.2, tap: { action: enter } }
      #  逗号键，label 为中文显示，value 为英文显示+提交值
      comma: { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." } , long_press: { display: "bubble", values: [ ",","."] }}
      # 中/英切换键，label 为按键显示文字
      earth: { tap: { label: "@language", action: "toggle_ascii" }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

      # ── 46 键布局专用底行符号键（默认布局不显示，仅布局选 46 键时启用）──
      # tap.value 必须半角：组词时进声笔加码（, . / '）。/ 空闲走 idle 直上屏顿号，组合仍 tap /。
      # 分号键点按已改全角直上屏，不在这组。
      # 上滑书名号：空闲直上屏；有码先交高亮再贴字面（yu + 句号上滑 → 用》），不进 punctuator。
      # 逗号/句号长按气泡：〈<>≤≥，选中走 commit 直上屏（别走 Rime，< 会被 punctuator 交成《）。
      # /：中文空闲点按顿号、上滑 ？（全角问号，不是 Big5 小问号 ﹖）、长按松手直上屏 /。两码以上点按先交高亮再贴顿号（jk/ → 叫、），一码仍进标点字。
      # , .：空闲 punctuator 出 ，。；一码标点字；两码以上交词再贴 ，。（jk, → 叫，；jk. → 叫。）。
      # quote46 空闲点按 “”、上滑 ‘’（光标进中间）；有码上滑也是 ‘’（先交高亮，光标进中间），不是 "。键帽右上仍 "。两码仍进组词，三码以上点按贴 “”（hui' → 遑“”）。
      # 分号上滑 ： 同样：有码交高亮再贴，空闲直贴。
      # 拉丁上屏后五个键改英文脸：组合态不套脸；覆盖脸点按仍问引擎，有码进 popping，空闲才贴 '。
      # 两码后点 ' 偶尔直上屏，就是覆盖脸没清、Compose isComposing 滞后。
      "/": { tap: { label: "/", value: "/" }, idle: "、", swipe_up: { label: "？", value: "？" }, long_press: { display: "key", values: [ { label: "/", value: "/" } ] } }
      ",": { tap: { label: "，", value: "," }, swipe_up: { label: "《", value: "《" }, long_press: { display: "bubble", values: ["〈", "<", "≤"] } }
      ".": { tap: { label: "。", value: "." }, swipe_up: { label: "》", value: "》" }, long_press: { display: "bubble", values: ["〉", ">", "≥"] } }
      quote46: { tap: { label: "'", value: "'" }, idle: "“”", swipe_up: { label: "\"", value: "‘’" }, idle_swipe_up: { label: "\"", value: "‘’" }, long_press: { display: "key", values: [ { label: "\"", value: "\"" } ] } }

  # ── 46 键布局专属手势覆盖段（中文）──
  # 与 qwerty 逐键合并（本段优先），仅在「布局选择 = 46 键」时生效。
  # 规则：字母键上滑 = 符号，长按 = 字母；tap 沿用 qwerty。
  # 下滑气泡在 46 键由代码换成飞系字根；N 上滑切助记键帽。
  qwerty_46:
    keys:
      # ── 数字行：中文上滑半角直上屏；长按英符走 Rime+分数。
      # 1/9/0 例外：上滑中文标点，长按半角直上屏（! ( ) 走 Rime 会被 punctuator 直接交成全角）。
      # 6 例外：上滑全角省略号……，长按半角…注入省略号变体。
      "1": { swipe_up: "！", long_press: { display: "bubble", values: ["!", "½", "⅓", "¼", "⅕", "⅙", "⅐", "⅛", "⅑", "⅒"] } }
      "2": { swipe_up: "@", long_press: { display: "bubble", values: [{ label: "@", action: "process_rime_key", value: "@" }, "⅔", "⅖"] } }
      "3": { swipe_up: "#", long_press: { display: "bubble", values: [{ label: "#", action: "process_rime_key", value: "#" }, "¾", "⅗", "⅜"] } }
      "4": { swipe_up: "$", long_press: { display: "bubble", values: [{ label: "$", action: "process_rime_key", value: "$" }, "⅘"] } }
      "5": { swipe_up: "%", long_press: { display: "bubble", values: [{ label: "%", action: "process_rime_key", value: "%" }, "⅚", "⅝"] } }
      "6": { swipe_up: "……", long_press: { display: "bubble", values: [{ label: "…", action: "process_rime_key", value: "rime_punct:^" }, "⅚"] } }
      "7": { swipe_up: "&", long_press: { display: "bubble", values: [{ label: "&", action: "process_rime_key", value: "&" }, "⅞"] } }
      "8": { swipe_up: "*", long_press: { display: "bubble", values: [{ label: "*", action: "process_rime_key", value: "*" }, "⅛", "⅜", "⅝", "⅞"] } }
      "9": { swipe_up: "（", long_press: { display: "bubble", values: ["("] } }
      "0": { swipe_up: "）", long_press: { display: "bubble", values: [")"] } }
      # ── 字母：空闲上滑直上屏中文符号；长按气泡英符+字母变体（无中文符号）；选中英符走 Rime。
      # 组合态字母上滑仍由代码拦截走 rime_upper，本段不管。g–m 编辑动作保留。
      q: { swipe_up: "·", long_press: { display: "bubble", values: [{ label: "·", action: "process_rime_key", value: "rime_punct:`" }, "q", "Q"] } }
      w: { swipe_up: "～", long_press: { display: "bubble", values: [{ label: "~", action: "process_rime_key", value: "~" }, "w", "W"] } }
      e: { swipe_up: "＋", long_press: { display: "bubble", values: [{ label: "+", action: "process_rime_key", value: "+" }, "e", "E", "è", "é", "ê", "ë"] } }
      r: { swipe_up: "－", long_press: { display: "bubble", values: [{ label: "-", action: "process_rime_key", value: "rime_punct:-" }, "r", "R"] } }
      t: { swipe_up: "＝", long_press: { display: "bubble", values: [{ label: "=", action: "process_rime_key", value: "rime_punct:=" }, "t", "T"] } }
      y: { swipe_up: "＿", long_press: { display: "bubble", values: [{ label: "_", action: "process_rime_key", value: "rime_punct:_" }, "y", "Y", "ÿ"] } }
      u: { swipe_up: "『", long_press: { display: "bubble", values: [{ label: "『", action: "process_rime_key", value: "{" }, "u", "U", "ù", "ú", "û", "ü"] } }
      i: { swipe_up: "』", long_press: { display: "bubble", values: [{ label: "』", action: "process_rime_key", value: "}" }, "i", "I", "ì", "í", "î", "ï"] } }
      o: { swipe_up: "「", long_press: { display: "bubble", values: [{ label: "[", action: "process_rime_key", value: "[" }, "o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { swipe_up: "」", long_press: { display: "bubble", values: [{ label: "]", action: "process_rime_key", value: "]" }, "p", "P"] } }
      # A：键帽 \。上滑不直上屏，跟长按选 \ 一样走 Rime。
      a: { swipe_up: { label: "\\", action: "process_rime_key", value: "\\" }, long_press: { display: "bubble", values: [{ label: "\\", action: "process_rime_key", value: "\\" }, "a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { swipe_up: "｜", long_press: { display: "bubble", values: [{ label: "|", action: "process_rime_key", value: "|" }, "s", "S", "ß"] } }
      d: { swipe_up: "×", long_press: { display: "bubble", values: [{ label: "×", action: "process_rime_key", value: "rime_punct:x" }, "d", "D"] } }
      f: { swipe_up: "÷", long_press: { display: "bubble", values: [{ label: "÷", action: "process_rime_key", value: "rime_punct:÷" }, "f", "F"] } }
      g: { swipe_up: "←", long_press: { display: "bubble", values: [{ label: "g", value: "g" }, { label: "G", value: "G" }, { label: "行首", action: "line_start" }] } }
      h: { swipe_up: "→", long_press: { display: "bubble", values: ["h", "H", { label: "行尾", action: "line_end" }] } }
      j: { swipe_up: { label: "↶", action: "undo", display: "both" }, long_press: { display: "bubble", values: ["j", "J", { label: "撤销", action: "undo" }] } }
      # K：空闲上滑贴 ↷；右滑重做。组合态上滑仍组词。
      k: { swipe_up: "↷", swipe_right: { label: "↷", action: "redo", display: "bubble" }, long_press: { display: "bubble", values: ["k", "K", { label: "重做", action: "redo" }] } }
      l: { swipe_up: { label: "Aa", action: "process_rime_key", value: "shift_enter", display: "both" }, long_press: { display: "bubble", values: ["l", "L"] } }
      z: { swipe_up: { label: "全选", action: "select_all", icon: "select_all", display: "both" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { swipe_up: { label: "剪切", action: "cut", icon: "cut", display: "both" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { swipe_up: { label: "复制", action: "copy", icon: "copy", display: "both" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { swipe_up: { label: "粘贴", action: "paste", icon: "paste", display: "both" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { swipe_up: { label: "剪贴板", action: "switch_route", value: "clipboard", icon: "clipboard", display: "both" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { swipe_up: { label: "助记", action: "toggle_mnemonic", display: "both" }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { swipe_up: { label: "收起", action: "command", value: "hide_keyboard", display: "both" }, long_press: { display: "bubble", values: ["m", "M"] } }

  # 英文键盘布局
  qwerty_en:
    # ── 按键布局模式 ──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        # 第四行（控制行）：位置/是否出现由本 rows 决定，行为在下方 keys.<id> 配置
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 第一行 ──
      q: { tap: "q", swipe_up: "1", long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "4", long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "7", long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "8", long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "9", long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "0", long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 数字行（设置「数字行」开关打开时显示在 QWERTY 上方）──
      "1": { tap: "1", swipe_up: "!", long_press: { display: "bubble", values: ["½", "⅓", "¼", "⅕", "⅙", "⅐", "⅛", "⅑", "⅒"] } }
      "2": { tap: "2", swipe_up: "@", long_press: { display: "bubble", values: ["⅔", "⅖"] } }
      "3": { tap: "3", swipe_up: "#", long_press: { display: "bubble", values: ["¾", "⅗", "⅜"] } }
      "4": { tap: "4", swipe_up: "$", long_press: { display: "bubble", values: ["⅘"] } }
      "5": { tap: "5", swipe_up: "%", long_press: { display: "bubble", values: ["⅚", "⅝"] } }
      "6": { tap: "6", swipe_up: "^", long_press: { display: "bubble", values: ["⅚"] } }
      "7": { tap: "7", swipe_up: "&", long_press: { display: "bubble", values: ["⅞"] } }
      "8": { tap: "8", swipe_up: "*", long_press: { display: "bubble", values: ["⅛", "⅜", "⅝", "⅞"] } }
      "9": { tap: "9", swipe_up: "(" }
      "0": { tap: "0", swipe_up: ")" }

      # ── 第二行 ──
      a: { tap: "a", swipe_up: "~", long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "/", long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: ":", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: ";", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "\"", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "\"", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "-", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "(", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: ")", long_press: { display: "bubble", values: ["l", "L"] } }
      # 分号键：仅 46 键布局使用（第三行补位）
      ";": { tap: { label: ";", value: ";" }, swipe_up: { label: ":", value: ":" }, long_press: { display: "key", values: [ { label: ":", value: ":" } ] } }
      # ";": { tap: ";", shift: ":" }

      # ── 第三行 ──
      z: { tap: "z", swipe_up: "*", long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "@", long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "、", long_press: { display: "bubble", values: ["c", "C"] } }
      v: { tap: "v", swipe_up: "?", long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: "!", long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: "%", long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "#", long_press: { display: "bubble", values: ["m", "M"] } }
      # shift：单击切单击态、双击锁定大写（命令值走键盘按键路由）
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      # delete：单击删除、长按重复删、上滑清空、下滑撤回、左右滑清空输入
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      # ?123：单击切面板，长按弹出「数字 / 常用符号」
      mode_change: { width: 1.2, tap: { action: command, value: mode_change }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      # 空格键：单击上屏空格；长按进入语音输入（含麦克风权限校验）
      # 长按若想改为「重复空格」：long_press: { values: [ { action: repeat_space, value: 5 } ] }
      space: { width: 3, tap: { action: space }, long_press: { values: [ { action: voice } ] } }
      # 回车键
      enter: { width: 1.2, tap: { action: enter } }
      #  逗号键，label 为中文显示，value 为英文显示+提交值
      "'": { tap: { label: ".", value: "." }, swipe_up: { label: ",", value: "," } }
      # ── 46 键布局专用底行符号键（英文）──
      # 逗号/句号：键帽右上和上滑 < >；长按气泡仍 〈<>≤≥，选中直上屏。
      # /：空闲点按半角顿号 ､、上滑 ?、长按松手直上屏 /。组合仍 tap /。
      "/": { tap: { label: "/", value: "/" }, idle: "､", swipe_up: { label: "?", value: "?" }, long_press: { display: "key", values: [ { label: "/", value: "/" } ] } }
      ",": { tap: { label: ",", value: "," }, swipe_up: { label: "<", value: "<" }, long_press: { display: "bubble", values: ["〈", "<", "≤"] } }
      ".": { tap: { label: ".", value: "." }, swipe_up: { label: ">", value: ">" }, long_press: { display: "bubble", values: ["〉", ">", "≥"] } }
      quote46: { tap: { label: "'", value: "'" }, swipe_up: { label: "\"", value: "\"" }, long_press: { display: "key", values: [ { label: "\"", value: "\"" } ] } }
      # 中/英切换键，label 为按键显示文字
      earth: { tap: { label: "@language", action: "toggle_ascii" }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

  # ── 46 键布局专属手势覆盖段（英文）──
  # 上滑仍英符直上屏。长按气泡和选中动作跟中文 46：英符走 Rime。
  # Q/R/T/Y 候选仍注入（` - = _），只改气泡。g–m 编辑动作保留。
  qwerty_en_46:
    keys:
      # ── 数字行：英文上滑全角直上屏；长按半角英符走 Rime+分数。
      # 1 上滑半角、长按 ! 走 Rime。9/0 上滑半角，长按全角括号直上屏。
      # 6：上滑半角省略号…，长按注入省略号变体。
      "1": { swipe_up: "!", long_press: { display: "bubble", values: [{ label: "!", action: "process_rime_key", value: "!" }, "½", "⅓", "¼", "⅕", "⅙", "⅐", "⅛", "⅑", "⅒"] } }
      "2": { swipe_up: "＠", long_press: { display: "bubble", values: [{ label: "@", action: "process_rime_key", value: "@" }, "⅔", "⅖"] } }
      "3": { swipe_up: "＃", long_press: { display: "bubble", values: [{ label: "#", action: "process_rime_key", value: "#" }, "¾", "⅗", "⅜"] } }
      "4": { swipe_up: "＄", long_press: { display: "bubble", values: [{ label: "$", action: "process_rime_key", value: "$" }, "⅘"] } }
      "5": { swipe_up: "％", long_press: { display: "bubble", values: [{ label: "%", action: "process_rime_key", value: "%" }, "⅚", "⅝"] } }
      "6": { swipe_up: "…", long_press: { display: "bubble", values: [{ label: "…", action: "process_rime_key", value: "rime_punct:^" }, "⅚"] } }
      "7": { swipe_up: "＆", long_press: { display: "bubble", values: [{ label: "&", action: "process_rime_key", value: "&" }, "⅞"] } }
      "8": { swipe_up: "＊", long_press: { display: "bubble", values: [{ label: "*", action: "process_rime_key", value: "*" }, "⅛", "⅜", "⅝", "⅞"] } }
      "9": { swipe_up: "(", long_press: { display: "bubble", values: ["（"] } }
      "0": { swipe_up: ")", long_press: { display: "bubble", values: ["）"] } }
      # ── 字母：空闲上滑英符直上屏；长按气泡英符跟中文 46。Q/R/T/Y 仍注入。
      q: { swipe_up: "·", long_press: { display: "bubble", values: [{ label: "·", action: "process_rime_key", value: "rime_punct:`" }, "q", "Q"] } }
      w: { swipe_up: "~", long_press: { display: "bubble", values: [{ label: "~", action: "process_rime_key", value: "~" }, "w", "W"] } }
      e: { swipe_up: "+", long_press: { display: "bubble", values: [{ label: "+", action: "process_rime_key", value: "+" }, "e", "E", "è", "é", "ê", "ë"] } }
      r: { swipe_up: "-", long_press: { display: "bubble", values: [{ label: "-", action: "process_rime_key", value: "rime_punct:-" }, "r", "R"] } }
      t: { swipe_up: "=", long_press: { display: "bubble", values: [{ label: "=", action: "process_rime_key", value: "rime_punct:=" }, "t", "T"] } }
      y: { swipe_up: "_", long_press: { display: "bubble", values: [{ label: "_", action: "process_rime_key", value: "rime_punct:_" }, "y", "Y", "ÿ"] } }
      u: { swipe_up: "{", long_press: { display: "bubble", values: [{ label: "{", action: "process_rime_key", value: "{" }, "u", "U", "ù", "ú", "û", "ü"] } }
      i: { swipe_up: "}", long_press: { display: "bubble", values: [{ label: "}", action: "process_rime_key", value: "}" }, "i", "I", "ì", "í", "î", "ï"] } }
      o: { swipe_up: "[", long_press: { display: "bubble", values: [{ label: "[", action: "process_rime_key", value: "[" }, "o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { swipe_up: "]", long_press: { display: "bubble", values: [{ label: "]", action: "process_rime_key", value: "]" }, "p", "P"] } }
      # A：键帽 /。上滑直上屏 /，长按仍 \。
      a: { swipe_up: "/", long_press: { display: "bubble", values: [{ label: "\\", action: "process_rime_key", value: "\\" }, "a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { swipe_up: "|", long_press: { display: "bubble", values: [{ label: "|", action: "process_rime_key", value: "|" }, "s", "S", "ß"] } }
      # D/F：键帽和上滑跟中文 46，× ÷ 直上屏。长按仍注入。
      d: { swipe_up: "×", long_press: { display: "bubble", values: [{ label: "×", action: "process_rime_key", value: "rime_punct:x" }, "d", "D"] } }
      f: { swipe_up: "÷", long_press: { display: "bubble", values: [{ label: "÷", action: "process_rime_key", value: "rime_punct:÷" }, "f", "F"] } }
      g: { swipe_up: "←", long_press: { display: "bubble", values: ["g", "G", { label: "行首", action: "line_start" }] } }
      h: { swipe_up: "→", long_press: { display: "bubble", values: ["h", "H", { label: "行尾", action: "line_end" }] } }
      j: { swipe_up: { label: "↶", action: "undo", display: "both" }, long_press: { display: "bubble", values: ["j", "J", { label: "撤销", action: "undo" }] } }
      # K：空闲上滑贴 ↷；右滑重做。组合态上滑仍组词。
      k: { swipe_up: "↷", swipe_right: { label: "↷", action: "redo", display: "bubble" }, long_press: { display: "bubble", values: ["k", "K", { label: "重做", action: "redo" }] } }
      l: { swipe_up: { label: "Aa", action: "process_rime_key", value: "shift_enter", display: "both" }, long_press: { display: "bubble", values: ["l", "L"] } }
      z: { swipe_up: { label: "全选", action: "select_all", icon: "select_all", display: "both" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { swipe_up: { label: "剪切", action: "cut", icon: "cut", display: "both" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { swipe_up: { label: "复制", action: "copy", icon: "copy", display: "both" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { swipe_up: { label: "粘贴", action: "paste", icon: "paste", display: "both" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { swipe_up: { label: "剪贴板", action: "switch_route", value: "clipboard", icon: "clipboard", display: "both" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { swipe_up: { label: "助记", action: "toggle_mnemonic", display: "both" }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { swipe_up: { label: "收起", action: "command", value: "hide_keyboard", display: "both" }, long_press: { display: "bubble", values: ["m", "M"] } }

  # 九键（T9）键盘配置
  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅 26 键 qwerty/qwerty_en 支持）。
  # schemas 声明使用九键布局的方案，未声明的方案一律全键盘；
  # 第三方九键方案在 xime.custom.yaml 的 t9.schemas 追加即可，无需改代码。
  t9:
    schemas: [t9_pinyin, t9, wanxiang_t9, rime_frost_t9]
    # ── 布局（三列结构，可完全自定义；未配置时为以下内置默认，与历史布局一致）──
    # left：左列（自上而下）。candidates = 拼音候选面板占位（候选态显示音节，
    #   空闲态显示下方 side_symbols）；也可放功能键或自定义键。
    # rows：主区（中间列）按行，每行一个键 id 列表。
    # right：右列（自上而下）。
    # 键 id 分三类：
    #   1. 数字 "0"~"9"：九键输入键。点按默认走九键数字输入（T9 核心交互），
    #      写 keys.<id>.tap.action 即可按手势动作改绑（不写 action 则保持内置行为）；
    #      键面字母用 keys.<id>.tap.label 覆盖（内置：1=分词、2=ABC…9=WXYZ），
    #      长按候选用 keys.<id>.long_press（未配置时用内置 2=A/B/C…9=W/X/Y/Z、1 无长按；
    #      配置后每项可用 action 触发任意动作，1 也能拥有长按候选），
    #      手势在 keys.<id> 配置（下方内置默认：上滑直接输入键面数字）。
    #   2. 功能键：candidates / symbol(符号) / number(数字面板) / space(空格) /
    #      earth(中英切换) / delete(退格) / clear(重输) / enter(回车)。
    #      组件与行为内置，位置可任意安排；键在行/列中的相对宽度用 keys.<id>.width 覆盖
    #      （默认：candidates 3、space 1.8、enter 2，其余 1）。
    #   3. 其他任意 id：自定义键，行为在 keys.<id> 定义（tap.label 为键面文字，
    #      缺省键面显示键名、点按提交键名本身；手势同全键盘写法）。
    layout:
      left: [candidates, symbol]
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [number, space, earth]
      right: [delete, clear, enter]
    # ── 左侧快捷符号栏（空闲态显示；列表长度不限，超过 4 个时可上下滑动）──
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "，"
      - "。"
      - "？"
      - "！"
    # ── 数字键手势（可自定义：在 xime.custom.yaml 的 keyboard.t9.keys 同路径覆盖）──
    # 键 id 为数字字符串 "1"~"9"（也可为 layout 中出现的自定义键 id）。
    # 内置默认：上滑直接输入键面数字（无需切数字键盘）；下滑内置不绑定动作，
    # 可按键级自行配置（如 swipe_down: { label: "复制", action: "copy" }，
    # 或 switch_route: clipboard 打开剪贴板面板）。
    # 动作可选值见 GestureAction：commit/select_all/copy/cut/paste/line_start/line_end/
    # undo/repeat/command/switch_route（value: emoji|symbol|clipboard 打开对应面板）等；
    # display 只管静态提示位置：key（画在键面）/ bubble（不画键面，留给气泡）/ both；
    # bubble 独立控制运行时是否弹气泡（默认 true）。二者互不影响。
    # 内置默认 display: "key" + bubble: false：数字作为键面角标提示、拖动不弹气泡。
    # 想要拖动气泡自行改为 bubble: true。手势功能与提示相互独立。
    keys:
      # 内置默认键面（tap.label 键面字母组）与长按候选（long_press.values，弹出气泡
      # 滑动选择后上屏所选文本）直接写在下方，可按需修改；"1" 无长按为历史行为。
      # 注意 keys 覆盖是键级整体替换：在 xime.custom.yaml 覆盖某个数字键时，
      # 键面/长按/手势要一并写上，漏写的字段回退代码内置兜底。
      "1": { tap: { label: "分词" }, swipe_up: { value: "1", display: "key", bubble: false } }
      "2": { tap: { label: "ABC" }, long_press: { display: "bubble", values: ["A", "B", "C"] }, swipe_up: { value: "2", display: "key", bubble: false } }
      "3": { tap: { label: "DEF" }, long_press: { display: "bubble", values: ["D", "E", "F"] }, swipe_up: { value: "3", display: "key", bubble: false } }
      "4": { tap: { label: "GHI" }, long_press: { display: "bubble", values: ["G", "H", "I"] }, swipe_up: { value: "4", display: "key", bubble: false } }
      "5": { tap: { label: "JKL" }, long_press: { display: "bubble", values: ["J", "K", "L"] }, swipe_up: { value: "5", display: "key", bubble: false } }
      "6": { tap: { label: "MNO" }, long_press: { display: "bubble", values: ["M", "N", "O"] }, swipe_up: { value: "6", display: "key", bubble: false } }
      "7": { tap: { label: "PQRS" }, long_press: { display: "bubble", values: ["P", "Q", "R", "S"] }, swipe_up: { value: "7", display: "key", bubble: false } }
      "8": { tap: { label: "TUV" }, long_press: { display: "bubble", values: ["T", "U", "V"] }, swipe_up: { value: "8", display: "key", bubble: false } }
      "9": { tap: { label: "WXYZ" }, long_press: { display: "bubble", values: ["W", "X", "Y", "Z"] }, swipe_up: { value: "9", display: "key", bubble: false } }
      # 空格上滑直接输入 0（不经九键组合，与数字键上滑同路径）；
      # 功能键也可按此方式配置手势（space/earth/delete/clear/enter 等）
      space: { swipe_up: { value: "0", display: "key", bubble: false } }

  # 笔画键盘配置
  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅 26 键 qwerty/qwerty_en 支持）。
  # schemas 声明使用笔画布局的方案，未声明的方案一律全键盘；
  # 第三方笔画方案在 xime.custom.yaml 的 stroke.schemas 追加即可。
  stroke:
    schemas: [stroke]
    # ── 左侧快捷符号列（常显；列表长度不限，超过 3 个时滚动显示）──
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "。"
      - "？"
      - "！"
      - "~"
    # ── 笔画键手势（可自定义：在 xime.custom.yaml 的 keyboard.stroke.keys 同路径覆盖）──
    # 键 id 为键面标签；内置默认：上滑输入对应数字（与历史行为一致，此前版本该手势
    # 因缺少滑动提示文本实际不触发，现修复生效），下滑可按需绑定编辑动作。
    # display：key（画在键面）/ bubble（不画键面，留给气泡）/ both；bubble 独立控制
    # 运行时是否弹气泡（默认 true）。上滑内置 display: "key" + bubble: false（不弹气泡，
    # 数字提示由键面角标承担）；tap 内置 bubble: false（按压不弹预览气泡，与九键拼音
    # 键盘的无气泡交互对齐）。手势功能与提示相互独立。
    keys:
      "一": { tap: { bubble: false }, swipe_up: { value: "1", display: "key", bubble: false } }
      "丨": { tap: { bubble: false }, swipe_up: { value: "2", display: "key", bubble: false } }
      "丿": { tap: { bubble: false }, swipe_up: { value: "3", display: "key", bubble: false } }
      "丶": { tap: { bubble: false }, swipe_up: { value: "4", display: "key", bubble: false } }
      "乛": { tap: { bubble: false }, swipe_up: { value: "5", display: "key", bubble: false } }
      "*": { tap: { bubble: false }, swipe_up: { value: "6", display: "key", bubble: false } }
      "分词": { tap: { bubble: false }, swipe_up: { value: "7", display: "key", bubble: false } }
      "，": { tap: { bubble: false }, swipe_up: { value: "8", display: "key", bubble: false } }
      "英": { tap: { bubble: false }, swipe_up: { value: "9", display: "key", bubble: false } }
      # 空格上滑直接输入 0（与笔画键上滑同路径，直接上屏）
      space: { swipe_up: { value: "0", display: "key", bubble: false } }

  # 手写键盘配置
  # schemas 声明使用手写布局的方案：手写不经过 rime 引擎（由 HandwritingEngine
  # 识别，模型在应用内管理），切换时不调 rime switchSchema、不走个人词典。
  # 未声明的方案一律全键盘；第三方手写方案在 xime.custom.yaml 的
  # handwriting.schemas 追加即可，无需改代码。
  handwriting:
    schemas: [handwriting]
